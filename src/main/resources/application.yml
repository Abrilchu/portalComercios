micronaut:
  application:
    name: ux-dual-backend-api
  server:
    port: 8080
    host: 0.0.0.0
    cors:
      enabled: true
      configurations:
        web:
          allowed-origins:
            - "http://localhost:5000"
            - "http://0.0.0.0:5000"
            - "http://127.0.0.1:5000"
          allowed-methods:
            - GET
            - POST
            - PUT
            - DELETE
            - OPTIONS
          allowed-headers:
            - "Content-Type"
            - "Authorization"
            - "Accept"
            - "Origin"
            - "X-Requested-With"
          max-age: 3600
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:uxdual-super-secret-jwt-key-2024-for-authentication-system-minimum-256-bits}
        generator:
          access-token:
            expiration: 86400 # 24 hours

datasources:
  default:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:uxdual_portal}?sslmode=require
    driverClassName: org.postgresql.Driver
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:password}
    dialect: POSTGRES

jdbc:
  default:
    show-sql: false

flyway:
  datasources:
    default:
      enabled: false
      locations: classpath:db/migration

jackson:
  serialization:
    writeDatesAsTimestamps: false
  deserialization:
    adjustDatesToContextTimeZone: false

endpoints:
  health:
    enabled: true
    sensitive: false
    details-visible: AUTHENTICATED
  info:
    enabled: true
    sensitive: false
  metrics:
    enabled: true
    sensitive: false

# Microservice-specific configurations
ux-dual:
  microservice:
    frontend-url: ${FRONTEND_URL:http://localhost:5000}
    api-prefix: "/api"
    auth-prefix: "/auth"
    health-check-interval: 30000
  business:
    default-empresa-id: 1
    currency: "ARS"
    timezone: "America/Argentina/Buenos_Aires"
    polling-interval: 3000
