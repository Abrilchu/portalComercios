micronaut:
  application:
    name: uxdual-portal
  server:
    port: 8080
    host: 0.0.0.0

datasources:
  default:
    url: jdbc:postgresql://localhost:5432/uxdual_portal?sslmode=disable
    driverClassName: org.postgresql.Driver
    username: uxdual_user
    password: uxdual123
    dialect: POSTGRES

flyway:
  enabled: false

security:
  authentication: bearer
  token:
    jwt:
      signatures:
        secret:
          generator:
            secret: mySecretKeyForLocalDevelopment
      generator:
        access-token:
          expiration: 86400 # 24 hours

jpa:
  default:
    properties:
      hibernate:
        hbm2ddl:
          auto: none
        show_sql: false