micronaut:
  application:
    name: ux-dual-portal
  server:
    port: 8080
    host: 0.0.0.0
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          secret:
            generator:
              secret: ${JWT_SECRET:uxdual-super-secret-jwt-key-2024-for-authentication-system-minimum-256-bits}
        generator:
          access-token:
            expiration: 86400 # 24 hours

datasources:
  default:
    url: jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:uxdual_portal}?sslmode=disable
    driverClassName: org.postgresql.Driver
    username: ${PGUSER:postgres}
    password: ${PGPASSWORD:password}
    dialect: POSTGRES

jdbc:
  default:
    show-sql: false

flyway:
  datasources:
    default:
      enabled: false
      locations: classpath:db/migration

jackson:
  serialization:
    writeDatesAsTimestamps: false
  deserialization:
    adjustDatesToContextTimeZone: false

endpoints:
  health:
    enabled: true
    sensitive: false
